<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>SAT Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="question_viewer/qv_style.css">
    <style>
        /* Ensures independent scrolling for long reading passages and questions */
        .split-panel {
            height: 65vh; 
            overflow-y: auto;
        }
        
        /* Custom scrollbar for a cleaner look (optional) */
        .split-panel::-webkit-scrollbar {
            width: 8px;
        }
        .split-panel::-webkit-scrollbar-thumb {
            background-color: #495057; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container-fluid my-4 px-4 px-lg-5">
        <div class="card bg-dark text-white border-secondary shadow-lg rounded-3">
            
            <div class="card-header border-secondary bg-dark d-flex justify-content-between align-items-center py-3 px-4">
                <span class="fs-6 text-uppercase fw-semibold text-secondary">SAT Practice Session</span>
                <div id="countdown-timer" class="badge bg-warning text-dark fs-6 fw-bold px-3 py-2 rounded-pill">
                    Time Remaining: --:--
                </div>
            </div>

            <div class="card-body p-0 border-bottom border-secondary">
                <div class="row g-0">
                    
                    <div id="stimulus-panel"
                        class="col-md-6 p-4 border-end border-secondary split-panel d-flex flex-column">

                        <div id="stimulus-container" class="fs-5 lh-base h-100">
                        </div>

                    </div>

                    <div id="question-panel" class="col-md-6 p-4 split-panel">
                        <div id="question-stem-container" class="mb-4 p-4 border border-secondary rounded-3 bg-black fs-5 lh-base">
                            </div>

                        <div id="answer-options-container" class="mb-4 d-grid gap-2">
                            </div>
                    </div>

                </div>
            </div>

            <div class="card-footer border-secondary bg-dark d-flex justify-content-between align-items-center py-3 px-4">
                <button class="btn btn-outline-light px-4 py-2" onclick="handlePreviousQuestion()">&larr; Previous</button>
                <button class="btn btn-primary px-4 py-2 fw-semibold" onclick="handleNextQuestion()">Next &rarr;</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard/timer.js"></script>
    <script src="question_viewer/question_viewer.js"></script>
</body>
</html>
