<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard/db_style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <ul class="nav nav-tabs mb-3" id="outerTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#custom-practice" type="button">Custom Practice</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#full-test" type="button">Full Test</button>
        </li>
        
        <li class="nav-item" role="presentation">
            <a class="nav-link" href="stats_window.html">Statistics</a>
        </li>
    </ul>

    <div class="tab-content" id="outerTabContent">
        <div class="tab-pane fade show active" id="custom-practice" role="tabpanel">
            
            <ul class="nav nav-pills mb-4" id="innerTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#filters" type="button">Filters</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#settings" type="button">Settings</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="filters">
                    <h4 class="mb-3">Choose Subject(s)</h4>
                    <div id="subjects-container" class="mb-4"></div>
                    <div id="topics-container" class="mb-4"></div>
                    <div id="subtopics-container" class="mb-4"></div>
                </div>

                <div class="tab-pane fade" id="settings">
                    <h4 class="mb-3">Select Amount of Questions</h4>
                    <div id="sliders-container" class="mb-5">
                        <p class="text-muted">Select subtopics in the Filters tab to see options here.</p>
                    </div>

                    <div class="row mb-5">
                        <div class="col-md-6">
                            <h4>Timer Settings</h4>
                            <p id="timeDisplay" class="fs-5 fw-bold text-primary">Time: 0 minutes and 0 seconds.</p>
                            <div class="d-flex align-items-center mt-3">
                                <input type="range" class="form-range" id="extra-time-slider" min="0" max="50" step="1" value="0" style="flex: 1;">
                                <span id="extra-time-val" class="ms-3 fw-bold" style="min-width: 120px;">No extra time</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h4>Difficulties</h4>
                            <div id="difficulty-container" class="mt-3"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button class="btn btn-primary" onclick="beginCustomSession()">Begin Session</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="full-test" role="tabpanel">
            <h3 class="mt-4">Full Test Mode</h3>
            <div class="mb-5">
                <h4 class="mb-3">Select Modules</h4>
                <div class="form-check fs-5 mb-2">
                    <input
                        class="form-check-input full-test-subject-cb"
                        type="checkbox"
                        id="full-test-math"
                        value="Math"
                        checked
                    />
                    <label class="form-check-label" for="full-test-math"> Math </label>
                </div>
                <div class="form-check fs-5">
                    <input
                        class="form-check-input full-test-subject-cb"
                        type="checkbox"
                        id="full-test-english"
                        value="English"
                        checked
                    />
                    <label class="form-check-label" for="full-test-english"> English </label>
                </div>
            </div>
            <div class="mb-5">
                <h4 class="mb-3">Module Settings</h4>
                <div class="form-check fs-5 mb-2">
                    <input class="form-check-input full-test-skip-cb" type="checkbox" id="skip-module-math" value="Math" />
                    <label class="form-check-label" for="skip-module-math"> Skip Module One: Math </label>
                </div>
                <div class="form-check fs-5">
                    <input
                        class="form-check-input full-test-skip-cb"
                        type="checkbox"
                        id="skip-module-english"
                        value="English"
                    />
                    <label class="form-check-label" for="skip-module-english"> Skip Module One: English </label>
                </div>
            </div>
            <div class="mb-5">
                <h4>Timer Settings</h4>
                <p id="full-test-timeDisplay" class="fs-5 fw-bold text-primary">Extra Time: 0 minutes</p>
                <div class="d-flex align-items-center mt-3">
                    <input
                        type="range"
                        class="form-range"
                        id="full-test-extra-time-slider"
                        min="0"
                        max="50"
                        step="1"
                        value="0"
                        style="flex: 1"
                    />
                    <span id="full-test-extra-time-val" class="ms-3 fw-bold" style="min-width: 120px"> No extra time </span>
                </div>
            </div>
            <div class="d-flex justify-content-end">
                <button class="btn btn-primary" onclick="beginFullTestSession()">Begin Full Test</button>
            </div>
        </div>
    </div>
    <script src="dashboard/db_js.js"></script>
</body>
</html>
