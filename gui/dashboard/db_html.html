<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>SAT Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {padding: 20px; font-family: 'Helvetica', Arial, sans-serif; background-color: #242424;}
        .topic-card {margin-bottom: 15px; padding: 15px; border-radius: 8px; background: #2b2f32; border: 1px solid #3d4245;}
        .slider-container {display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;}
        .slider-label {flex: 1; font-weight: bold;}
        .slider-value {width: 40px; text-align: center; font-weight: bold; background: #444; border-radius: 4px; padding: 2px;}
        input[type=range] { flex: 2; margin: 0 15px;}
        .nav-pills .nav-link.active { background-color: #1f538d;}
        .btn-primary {background-color: #1f538d; border: none; padding: 10px 20px; font-size: 1.1rem;}
        .btn-primary:hover {background-color: #14375e;}
    </style>
</head>
<body>

    <ul class="nav nav-tabs mb-3" id="outerTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#custom-practice" type="button">Custom Practice</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#full-test" type="button">Full Test</button>
        </li>
    </ul>

    <div class="tab-content" id="outerTabContent">
        <div class="tab-pane fade show active" id="custom-practice" role="tabpanel">
            
            <ul class="nav nav-pills mb-4" id="innerTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#filters" type="button">Filters</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#settings" type="button">Settings</button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="filters">
                    <h4 class="mb-3">Choose Subject(s)</h4>
                    <div id="subjects-container" class="mb-4"></div>
                    <div id="topics-container" class="mb-4"></div>
                    <div id="subtopics-container" class="mb-4"></div>
                </div>

                <div class="tab-pane fade" id="settings">
                    <h4 class="mb-3">Select Amount of Questions</h4>
                    <div id="sliders-container" class="mb-5">
                        <p class="text-muted">Select subtopics in the Filters tab to see options here.</p>
                    </div>

                    <div class="row mb-5">
                        <div class="col-md-6">
                            <h4>Timer Settings</h4>
                            <p id="timeDisplay" class="fs-5 fw-bold text-info">Time: 0 minutes and 0 seconds.</p>
                            <div class="d-flex align-items-center mt-3">
                                <input type="range" class="form-range" id="extra-time-slider" min="0" max="50" step="1" value="0" style="flex: 1;">
                                <span id="extra-time-val" class="ms-3 fw-bold" style="min-width: 120px;">No extra time</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h4>Difficulties</h4>
                            <div id="difficulty-container" class="mt-3"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button class="btn btn-primary" onclick="beginSession()">Begin Session</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="full-test" role="tabpanel">
            <h3 class="mt-4">Full Test Mode</h3>
            <p class="text-muted">Full test implementation will come later. (WIP)</p>
        </div>
    </div>

    <div id="session-container" style="display: none;" class="container mt-4">
        <div class="card bg-dark text-white p-4 border-secondary">
            <div id="countdown-timer" class="fs-4 fw-bold text-warning mb-3">Time Remaining: --:--</div>
            
            <div id="question-stem-container" class="mb-4 p-3 border border-secondary rounded bg-black">
                </div>
            
            <div id="answer-options-container" class="mb-4">
                </div>
            
            <div class="d-flex justify-content-between">
                <button class="btn btn-outline-light" onclick="handlePreviousQuestion()">Previous</button>
                <button class="btn btn-primary" onclick="handleNextQuestion()">Next</button>
            </div>
        </div>
    </div>

    <script src="timer.js"></script>
    <script src="question_viewer.js"></script>
    <script src="db_js.js"></script>
</body>
</html>
